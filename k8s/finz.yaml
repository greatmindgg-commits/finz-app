apiVersion: v1
kind: Namespace
metadata:
  name: finz
---
# echo -n 'finz_user' | base64  etc. — values below are base64 of your db creds
apiVersion: v1
kind: Secret
metadata:
  name: finz-db-secret
  namespace: finz
type: Opaque
data:
  POSTGRES_USER: Zmluel91c2Vy
  POSTGRES_PASSWORD: Zmluel9wYXNzXzIwMjY=
  POSTGRES_DB: Zmluel9kYg==
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: finz-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finz-db-pvc
  namespace: finz
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: finz-ebs-sc
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finz-db
  namespace: finz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: finz-db }
  template:
    metadata:
      labels: { app: finz-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: finz-db-secret }
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "finz_user", "-d", "finz_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: db-storage
          persistentVolumeClaim: { claimName: finz-db-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: finz-db
  namespace: finz
spec:
  selector: { app: finz-db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finz-backend
  namespace: finz
spec:
  replicas: 2
  selector:
    matchLabels: { app: finz-backend }
  template:
    metadata:
      labels: { app: finz-backend }
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z finz-db 5432; do echo waiting for db; sleep 3; done"]
      containers:
        - name: backend
          image: ghcr.io/greatmindgg-commits/finz-app/finz-backend:latest
          ports: [{ containerPort: 5000 }]
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "finz-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: finz-db-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: finz-db-secret, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: finz-db-secret, key: POSTGRES_DB } }
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: finz
spec:
  selector: { app: finz-backend }
  ports: [{ port: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finz-frontend
  namespace: finz
spec:
  replicas: 2
  selector:
    matchLabels: { app: finz-frontend }
  template:
    metadata:
      labels: { app: finz-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/greatmindgg-commits/finz-app/finz-frontend:latest
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: finz-frontend
  namespace: finz
spec:
  type: LoadBalancer
  selector: { app: finz-frontend }
  ports:
    - port: 80
      targetPort: 8080
